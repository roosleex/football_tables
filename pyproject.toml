[project]
name = "football-tables"
version = "0.1.0"
description = "Standings for major European football leagues (FastAPI + React)"
readme = "README.md"
authors = [
    { name = "roosleex", email = "roosleex@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]